<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheet Test 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e8eaf6;font-family:sans-serif;padding:20px}
button,label{display:block;width:100%;padding:16px;margin:10px 0;font-size:16px;border-radius:10px;border:none;cursor:pointer;background:#5b8dee;color:#fff;text-align:left}
#log{background:#222;padding:10px;border-radius:8px;font-size:12px;margin-top:10px;min-height:80px;word-break:break-all}

/* Exact copy of app's bottom-nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#181c27;border-top:1px solid #3a4060;display:flex;align-items:center;justify-content:space-around;height:72px;z-index:50}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;color:#6b75a0;cursor:pointer;font-size:11px;padding:8px 0}
.capture-circle{width:52px;height:52px;border-radius:50%;background:#5b8dee;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}

/* Exact copy of app's camera-sheet */
.sheet{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);pointer-events:none}
.sheet-inner{position:absolute;bottom:0;left:0;right:0;background:#1e2335;border-radius:20px 20px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));pointer-events:auto}
.sheet-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#252a3d;border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:15px;font-weight:500;color:#e8eaf6;border:none;width:100%}
</style>
</head>
<body>
<h2 style="margin-bottom:16px">Sheet Test 2 — Exact App Copy</h2>
<p style="color:#9fa8c4;font-size:13px;margin-bottom:16px">กดปุ่มกล้องด้านล่าง แล้วลองกดแต่ละปุ่ม</p>
<div id="log">ผลลัพธ์...</div>

<!-- Bottom nav (exact copy) -->
<div class="bottom-nav">
  <button class="nav-btn">📊 Dashboard</button>
  <button class="nav-btn">📋 รายการ</button>
  <!-- Camera button (exact copy) -->
  <button class="nav-btn" onclick="openSheet()" style="flex:0 0 72px">
    <div class="capture-circle">📷</div>
  </button>
  <button class="nav-btn">📊 Report</button>
  <button class="nav-btn">🏢 บริษัท</button>
</div>

<!-- Sheet (exact copy) -->
<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <p style="text-align:center;color:#6b75a0;font-size:13px;margin-bottom:12px">เลือกรูป</p>

    <!-- Test A: label for= with hidden input (current app method) -->
    <label class="sheet-row" for="inp-a">
      📷 Test A: label for= (current method)
    </label>
    <input type="file" id="inp-a" accept="image/*" capture="environment"
      style="position:fixed;top:-300px;left:-300px;width:1px;height:1px"
      onchange="log('✅ A worked: ' + this.files[0]?.name)">

    <!-- Test B: input inside label -->
    <label class="sheet-row">
      🖼 Test B: input inside label
      <input type="file" accept="image/*" style="display:none"
        onchange="log('✅ B worked: ' + this.files[0]?.name)">
    </label>

    <!-- Test C: button that calls .click() -->
    <button class="sheet-row" onclick="document.getElementById('inp-c').click()">
      🔘 Test C: JS .click()
    </button>
    <input type="file" id="inp-c" accept="image/*" style="display:none"
      onchange="log('✅ C worked: ' + this.files[0]?.name)">

    <button onclick="closeSheet()" style="width:100%;padding:14px;background:#2d3350;border:1px solid #3a4060;border-radius:12px;color:#9fa8c4;font-size:15px;cursor:pointer;pointer-events:auto;margin-top:4px">ยกเลิก</button>
  </div>
</div>

<script>
function openSheet() {
  log('openSheet called');
  document.getElementById('sheet').style.display = 'block';
}
function closeSheet() {
  document.getElementById('sheet').style.display = 'none';
}
function log(msg) {
  const el = document.getElementById('log');
  el.innerHTML = new Date().toLocaleTimeString() + ': ' + msg + '<br>' + el.innerHTML;
}
</script>
</body>
</html>
