<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>Tax Manager — เข้าสู่ระบบ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,sans-serif;background:#0f1117;color:#e8eaf6;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#181c27;border:1px solid #3a4060;border-radius:16px;padding:36px 28px;width:100%;max-width:360px;text-align:center}
  .logo{width:64px;height:64px;background:#5b8dee;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px}
  h1{font-size:20px;font-weight:700;margin-bottom:6px}
  p{font-size:13px;color:#9fa8c4;margin-bottom:28px;line-height:1.6}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;background:#fff;color:#222;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
  .btn-google:hover{background:#f0f0f0}
  .note{font-size:12px;color:#6b75a0;margin-top:20px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📄</div>
  <h1>Tax / WHT Manager</h1>
  <p>จัดการใบกำกับภาษีและใบหัก ณ ที่จ่าย<br>สำหรับหลายบริษัทในที่เดียว</p>
  <a href="/auth/google" class="btn-google">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.34-8.16 2.34-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    เข้าสู่ระบบด้วย Google
  </a>
  <div class="note">ระบบนี้ใช้สำหรับธุรกิจเท่านั้น<br>ข้อมูลของคุณจะถูกเก็บอย่างปลอดภัย</div>
</div>
</body>
</html>
