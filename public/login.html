<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="อีสานพัฒนา">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>เข้าสู่ระบบ — Tax Invoice Manager</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1117;color:#e8eaf6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#181c27;border:1px solid #3a4060;border-radius:18px;padding:32px 26px;width:100%;max-width:360px}
  .logo{width:76px;height:76px;border-radius:18px;margin:0 auto 16px;display:block;object-fit:cover}
  h1{font-size:19px;font-weight:700;text-align:center;margin-bottom:4px}
  .sub{font-size:13px;color:#9fa8c4;text-align:center;margin-bottom:24px}
  label{display:block;font-size:12px;color:#9fa8c4;margin:0 0 6px 2px}
  input{width:100%;padding:13px 14px;background:#222736;border:1px solid #3a4060;border-radius:10px;color:#e8eaf6;font-size:15px;margin-bottom:14px}
  input:focus{outline:none;border-color:#5b8dee}
  button{width:100%;padding:14px;background:#5b8dee;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{font-size:13px;color:#ff6b6b;min-height:20px;margin-bottom:10px;text-align:center}
  .note{font-size:11px;color:#6b75a0;text-align:center;margin-top:18px;line-height:1.6}
  body.shake .card{animation:sh .4s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="card">
  <img src="/icons/icon-192.png" alt="" class="logo">
  <h1>Tax / WHT Manager</h1>
  <div class="sub">บริษัท อีสาน พัฒนา จำกัด</div>

  <form id="f" autocomplete="on">
    <label for="email">อีเมล</label>
    <input type="email" id="email" name="email" autocomplete="username" inputmode="email" required placeholder="name@company.com">

    <label for="password">รหัสผ่าน</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">

    <div class="msg" id="msg"></div>
    <button type="submit" id="btn">เข้าสู่ระบบ</button>
  </form>

  <div class="note">หากลืมรหัสผ่าน กรุณาติดต่อผู้ดูแลระบบ<br>เพื่อตั้งรหัสผ่านใหม่ให้</div>
</div>

<script>
const f = document.getElementById('f');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');

f.addEventListener('submit', async e => {
  e.preventDefault();
  btn.disabled = true; msg.textContent = '';
  try {
    const r = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const d = await r.json();
    if (r.ok) { location.href = '/'; return; }
    msg.textContent = d.error || 'เข้าสู่ระบบไม่สำเร็จ';
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 400);
    document.getElementById('password').value = '';
  } catch {
    msg.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
